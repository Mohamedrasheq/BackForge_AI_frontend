name: Dev Build (iOS Only)

on:
  push:
    branches:
      - "dev-ios-*"

jobs:
  test:
    name: Lint & Checks
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Lint
        run: npx expo lint
      - name: TypeScript Check
        run: npx tsc --noEmit
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Security Audit
        run: npm audit --audit-level=high || true
      - name: Metro Bundle Check
        run: npx expo export --platform ios --output-dir /tmp/bundle-check && rm -rf /tmp/bundle-check

  build_ios:
    name: Build iOS
    needs: [test]
    type: build
    params:
      platform: ios
      profile: development
