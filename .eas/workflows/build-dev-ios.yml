name: Dev Build (iOS Only)

on:
  push:
    branches:
      - "dev-ios-*"

jobs:
  test:
    name: Lint & TypeCheck
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Lint
        run: npx expo lint
      - name: TypeScript Check
        run: npx tsc --noEmit

  build_ios:
    name: Build iOS
    needs: [test]
    type: build
    params:
      platform: ios
      profile: development
