name: Expo EAS Build (Multi Environment)

on:
  push:
    branches:
      - "dev-*"
      - "preview-*"
      - "production-*"

jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: development

  build_ios:
    type: build
    params:
      platform: ios
      profile: development
