name: Preview Build (Android Only)

on:
  push:
    branches:
      - "preview-android-*"

jobs:
  test:
    name: Lint & Checks
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Lint
        run: npx expo lint
      - name: TypeScript Check
        run: npx tsc --noEmit
      - name: Expo Doctor
        run: npx expo-doctor || true
      - name: Security Audit
        run: npm audit --audit-level=high || true
      - name: Metro Bundle Check
        run: npx expo export --platform android --output-dir /tmp/bundle-check && rm -rf /tmp/bundle-check

  build_android:
    name: Build Android
    needs: [test]
    type: build
    params:
      platform: android
      profile: preview
